[project]
name = "aws-ai"
version = "0.1.0"
description = "Thin, testable boto3 wrappers for the AWS AI services on the AIF-C01 exam"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["boto3>=1.35"]

[project.scripts]
# The aws bedrock-agent verbs against the local knowledge base (local-kb/PLAN.md).
local-kb = "aws_ai.local_kb.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[bedrock-runtime,comprehend]>=1.35",
    "httpx>=0.27",  # FastAPI's TestClient, for the local-kb server tests
]
# Only scripts/enable_pgvector.py needs a Postgres driver; keep it out of the default install.
db = ["psycopg[binary]>=3.2"]
local = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "markdownify>=0.13",
    "pypdf>=5",
    "tokenizers>=0.20",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_ai"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
