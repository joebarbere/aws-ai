[project]
name = "aws-ai"
version = "0.1.0"
description = "Thin, testable boto3 wrappers for the AWS AI services on the AIF-C01 exam"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["boto3>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "boto3-stubs[bedrock-runtime,comprehend]>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_ai"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
