# Local stand-ins for the AWS side of a Bedrock knowledge base. See PLAN.md, Phase 1.
#
#   rustfs      S3 (the data source bucket)      :9000 API, :9001 console
#   kb-events   SQS: bucket events, polled       :8098
#   opensearch  OpenSearch Serverless            :9200 (HTTPS, security plugin on)
#   dashboards  the AOSS dashboards endpoint     :5601
#   postgres    Aurora PostgreSQL + pgvector     :5432 (the RDS store; PGVECTOR_PLAN.md)
#
# Credentials come from .env (copy .env.example; make local-up does it for you). Ports bind to
# 127.0.0.1 only. The ingestion worker and runtime API run on the host, where LM Studio is.

name: local-kb

services:
  rustfs:
    image: docker.io/rustfs/rustfs:1.0.4
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
      # Bucket events go to the kb-events queue, not straight to the host: RustFS's SSRF guard
      # blocks link-local addresses even when allow-listed, and rootless podman's
      # host.containers.internal is 169.254.1.2. A compose service name is a private address,
      # which the allowlist does permit.
      RUSTFS_NOTIFY_ENABLE: "true"
      RUSTFS_NOTIFY_WEBHOOK_ENABLE_KB: "on"
      RUSTFS_NOTIFY_WEBHOOK_ENDPOINT_KB: http://kb-events:8098/s3-events
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: http://kb-events:8098
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 10s
      retries: 6
    depends_on:
      - kb-events

  # The SQS queue in "S3 -> SQS -> poller -> StartIngestionJob". See events/queue.py.
  kb-events:
    image: docker.io/library/python:3.13-alpine
    command: ["python", "-u", "/app/queue.py"]
    ports:
      - "127.0.0.1:8098:8098"
    volumes:
      - ./events:/app:ro,Z

  opensearch:
    image: docker.io/opensearchproject/opensearch:3.9.0
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      # Only read on first start with an empty volume; changing it later does nothing.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set in .env}
      OPENSEARCH_JAVA_OPTS: -Xms2g -Xmx2g
      # Disk watermarks as free space, not percentages: the defaults (85/90/95%) block index
      # creation on any mostly full laptop disk even with tens of GB free.
      cluster.routing.allocation.disk.watermark.low: 10gb
      cluster.routing.allocation.disk.watermark.high: 5gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  dashboards:
    image: docker.io/opensearchproject/opensearch-dashboards:3.9.0
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
    depends_on:
      - opensearch

  # Bedrock's RDS vector store. Same pgvector as the Phase 0b Aurora capture (0.8.2); Postgres
  # 17.10 against Aurora's 17.11. Bedrock talks to Aurora through the Data API; locally the
  # store connects directly. To measure one store alone, start only the services it needs:
  #   podman-compose up -d rustfs kb-events postgres
  postgres:
    image: docker.io/pgvector/pgvector:0.8.2-pg17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: bedrock
      # Only read on first start with an empty volume, like OpenSearch's admin password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    # shared_buffers holds the HNSW graph; maintenance_work_mem lets an index build stay in
    # memory instead of spilling. Aurora's text search default is simple, the image's english.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - default_text_search_config=pg_catalog.simple
    shm_size: 1g
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bedrock"]
      interval: 10s
      retries: 6

volumes:
  rustfs-data:
  opensearch-data:
  postgres-data:
